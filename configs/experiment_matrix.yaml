project: Agentic-RL
model: Qwen/Qwen2.5-Coder-3B-Instruct
dataset: spider-1.0
algorithm: GRPO
protocol: blind-final-v1
stages:
  smoke:
    - name: smoke_ctx2048_turn1
      context_length: 2048
      max_turns: 1
      explicit_check: false
      reward_mode: execution
      learning_rate: 1.0e-6
      epochs: 1
  main:
    - name: ctx4096_turn1
      context_length: 4096
      max_turns: 1
      explicit_check: false
      reward_mode: execution
      learning_rate: 1.0e-6
      epochs: 2
  ablations:
    - name: ctx2048_turn1
      context_length: 2048
      max_turns: 1
      explicit_check: false
      reward_mode: execution
      learning_rate: 1.0e-6
      epochs: 2
    - name: ctx2048_turn3
      context_length: 2048
      max_turns: 3
      explicit_check: false
      reward_mode: execution
      learning_rate: 1.0e-6
      epochs: 2
    - name: ctx2048_turn3_check
      context_length: 2048
      max_turns: 3
      explicit_check: true
      reward_mode: execution
      learning_rate: 1.0e-6
      epochs: 2
    - name: ctx4096_turn3
      context_length: 4096
      max_turns: 3
      explicit_check: false
      reward_mode: execution
      learning_rate: 1.0e-6
      epochs: 2
  controls:
    - name: no_update_ctx4096_turn1
      context_length: 4096
      max_turns: 1
      explicit_check: false
      reward_mode: execution
      learning_rate: 0.0
      epochs: 2
    - name: validity_only_ctx4096_turn1
      context_length: 4096
      max_turns: 1
      explicit_check: false
      reward_mode: validity_only
      learning_rate: 1.0e-6
      epochs: 2
