name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-asyncio sqlglot pandas pyarrow pyyaml httpx "openai>=2,<3" datasets hydra-core omegaconf safetensors
          pip install -e . --no-deps
      - name: Unit and integration tests (CPU)
        run: python -m pytest -q
      - name: Audit no gold-label leakage
        run: python scripts/audit_leakage.py --output artifacts/leakage_audit.json
      - name: Dry-run experiment planner
        run: python scripts/run_experiment_matrix.py --stage smoke --output-dir /tmp/agentic-rl-ci
      - name: Compile Python
        run: python -m compileall -q src agent scripts
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Upload blind-protocol audit
        uses: actions/upload-artifact@v4
        with:
          name: leakage-audit
          path: artifacts/leakage_audit.json
          if-no-files-found: error
