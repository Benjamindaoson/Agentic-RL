name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-asyncio sqlglot pandas pyarrow pyyaml httpx "openai>=2,<3" datasets hydra-core omegaconf safetensors
          pip install -e . --no-deps
          pip install --no-deps agentlightning==1.0.2 verl==0.8.0
      - name: Unit and integration tests (CPU)
        run: python -m pytest -q
      - name: Validate actual upstream Agent Lightning and veRL 0.8.0 config (CPU)
        run: python scripts/verify_framework_contract.py --output artifacts/framework_contract.json
      - name: Audit no gold-label leakage
        run: python scripts/audit_leakage.py --output artifacts/leakage_audit.json
      - name: Real-SQLite synthetic Spider dataset validation
        run: python -m pytest -q tests/test_dataset_integrity.py
      - name: Dry-run experiment planner
        run: python scripts/run_experiment_matrix.py --stage smoke --output-dir /tmp/agentic-rl-ci
      - name: Compile Python
        run: python -m compileall -q src agent scripts
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: CPU readiness gate
        run: python scripts/offline_readiness.py --output artifacts/offline_readiness.json --skip-tests
      - name: Upload blind-protocol audit
        uses: actions/upload-artifact@v4
        with:
          name: offline-contract-and-leakage-audits
          path: |
            artifacts/leakage_audit.json
            artifacts/framework_contract.json
            artifacts/offline_readiness.json
          if-no-files-found: error
