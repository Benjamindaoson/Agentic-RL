name: One-time delete verified merged development branches

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/consolidate-merged-branches.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  consolidate:
    name: Delete redundant merged branches (preserve main)
    if: github.repository == 'Benjamindaoson/Agentic-RL' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const originalMainSha = 'd3f15c30b1e52d1b40bba354a305861ba9cacaeb';
            const branches = [
              { name: 'feat/verified-rl-training-eval', pr: 1, sha: '11012fc75ced96c222f495d06b44a9386458757a' },
              { name: 'fix/cpu-hardening-and-evidence-integrity', pr: 2, sha: 'a7f1618192e60f83f6afc503c08a8042d4e9168c' },
              { name: 'fix/offline-validation-and-integrity', pr: 3, sha: '42f94accf6fd434b1eeda9c3582bea24441b893a' },
              { name: 'feat/offline-completion-20261009', pr: 4, sha: '8d80eed0178a2a19845d32e82dbfb9252bd15feb' },
            ];
            // This temporary workflow must be the ONLY change from the verified
            // final main. Never clean a repository that has moved unexpectedly.
            const mainBranch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (mainBranch.data.commit.sha !== context.sha) {
              throw Error('main advanced since triggering this run; refusing cleanup');
            }
            const cleanupCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha });
            if (cleanupCommit.data.parents.length !== 1 ||
                cleanupCommit.data.parents[0].sha !== originalMainSha) {
              throw Error('main content does not match the verified final merge');
            }
            const verifiedFinal = await github.rest.git.getCommit({ owner, repo, commit_sha: originalMainSha });
            const lastBranch = await github.rest.git.getCommit({ owner, repo, commit_sha: branches[3].sha });
            if (verifiedFinal.data.tree.sha !== lastBranch.data.tree.sha) {
              throw Error('final development tree differs from final main tree');
            }
            // Preflight ALL branches before deleting any, so nothing newer or
            // unmerged can be removed due to an unexpected branch movement.
            for (const item of branches) {
              const pr = await github.rest.pulls.get({ owner, repo, pull_number: item.pr });
              if (!pr.data.merged_at || pr.data.base.ref !== 'main' ||
                  pr.data.head.ref !== item.name || pr.data.head.sha !== item.sha) {
                throw Error('PR ' + item.pr + ' does not match its merged branch');
              }
              const branch = await github.rest.repos.getBranch({ owner, repo, branch: item.name });
              if (branch.data.protected || branch.data.commit.sha !== item.sha) {
                throw Error('branch is protected or contains new work: ' + item.name);
              }
              core.info('Verified PR #' + item.pr + ' is merged, branch head unchanged: ' + item.name);
            }
            for (const item of branches) {
              await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + item.name });
              core.info('Deleted merged branch: ' + item.name);
            }
            const remaining = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
            if (remaining.length !== 1 || remaining[0].name !== 'main') {
              throw Error('Expected only main but found: ' + remaining.map(x => x.name).join(', '));
            }
            core.info('SUCCESS: all 4 merged feature branches deleted; main is the only remaining branch.');
